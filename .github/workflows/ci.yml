name: CI
on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]
env:
  TURBO_TELEMETRY_DISABLED: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Install, Build, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup PNPM
        uses: pnpm/setup@v3
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          install: false

      - name: Install Dependencies
        run: pnpm install # note this runs pre-build

      - name: Prebuild Bin Executables
        run: pnpm run pre-build

      - name: Build Packages
        run: pnpm run build

      - name: Check For Formatting Issues
        run: pnpm run format:check

      - name: Lint Packages
        run: pnpm run lint
      - run: pnpm run lint:fs
      - run: pnpm run lint:deps
      - run: pnpm run lint:rac
      - run: pnpm run lint:package
      - run: pnpm run typecheck:scripts

      - name: Test Packages
        run: pnpm run test
